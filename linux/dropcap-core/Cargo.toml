[package]
name = "dropcap-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
test-hooks = [] # 배포 빌드에서도 DROPCAP_TEST_* 시험 훅을 켬(보통은 개발 빌드에서만, test_hooks.rs)

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
quick-xml = "0.38"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "fs"] }
flate2 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
url = "2"
encoding_rs = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
dom_smoothie = "0.18"
dom_query = "0.28"
log = "0.4"
libc = "0.2"
once_cell = "1"

[dev-dependencies]
tempfile = "3"
flate2 = "1"
encoding_rs = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
regex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
