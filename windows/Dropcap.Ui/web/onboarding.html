<!doctype html>
<html lang="ko" data-page="onboarding">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://img.dropcap.example data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; frame-src 'none'">
<title>관심 분야 고르기</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="onboarding.css">
<script src="bridge.js"></script>
<script src="ui.js"></script>
<script src="mock/onboarding.js"></script>
</head>
<body>
<header class="head">
  <div class="mark"><span class="d">D</span><span class="rest">ROPCAP</span></div>
  <h1>어떤 소식을 받아 볼까요?</h1>
  <p>고른 분야의 언론사 피드가 켜지고, 매거진 지면도 그 분야로 엮입니다. 알림은 처음엔 고른 분야 중 두 개만 바로 오고, 나머지는 정한 시각에 한 방울로 모아 옵니다.</p>
</header>
<main id="body">
  <label id="top" class="top" hidden>
    <span class="tic"></span>
    <span class="tx"><b></b><small></small></span>
    <input type="checkbox" class="switch" id="topOn">
  </label>
  <div id="cards" class="cards" role="group" aria-label="분야"></div>
  <button id="more" class="more" hidden><i data-ic="chevronDown"></i><span>더 보기</span></button>
</main>
<footer class="foot">
  <span id="count" class="count"></span>
  <button id="go" class="go" disabled>시작하기</button>
</footer>
<script src="onboarding.js"></script>
</body>
</html>
